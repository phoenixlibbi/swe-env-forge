[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "swe-env-forge"
version = "0.1.0"
description = "Forge verified, hack-resistant RL environments for coding agents from any git repository: mine, build, validate, specify, run and grade SWE-bench / SWE-bench Pro style tasks with binary and dense rewards."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Muhammad Labeeb Tariq" }]
dependencies = []
keywords = ["swe-bench", "swe-bench-pro", "reinforcement-learning", "rlvr", "llm-agents", "agent-evaluation",
            "evals", "benchmarks", "verifiers", "reward-hacking", "coding-agents", "long-horizon"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/phoenixlibbi/swe-env-forge"
Issues = "https://github.com/phoenixlibbi/swe-env-forge/issues"

[project.scripts]
sweforge = "swe_env_forge.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["swe_env_forge"]

[tool.pytest.ini_options]
markers = ["docker: needs a Docker daemon and network (deselect with -m 'not docker')",
           "network: needs internet access"]
addopts = "-m 'not docker and not network'"
testpaths = ["tests"]
